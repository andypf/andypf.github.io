<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" fill="#1a1a1a"/>

  <!-- Simplified peacock shape from logo -->
  <g transform="translate(50,50) scale(0.35)">
    <!-- Main peacock body curves -->
    <path d="M 0,-50 C -30,-30 -40,0 -30,30 C -20,50 0,60 20,50 C 30,45 35,35 32,20 C 30,5 20,-10 10,-25 C 5,-35 0,-45 0,-50 Z"
          fill="#cccccc" opacity="0.9"/>

    <!-- Decorative feather elements -->
    <ellipse cx="-15" cy="-20" rx="8" ry="15" fill="#cccccc" opacity="0.7" transform="rotate(-30 -15 -20)"/>
    <ellipse cx="5" cy="-30" rx="6" ry="12" fill="#cccccc" opacity="0.7" transform="rotate(10 5 -30)"/>
    <ellipse cx="15" cy="-15" rx="7" ry="13" fill="#cccccc" opacity="0.7" transform="rotate(40 15 -15)"/>

    <!-- Accent curve -->
    <path d="M -10,0 Q 0,15 10,0" stroke="#2563eb" stroke-width="3" fill="none" opacity="0.8"/>
  </g>
</svg>
